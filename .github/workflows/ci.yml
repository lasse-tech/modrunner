name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Build app bundle
        run: Scripts/make-app.sh release

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ModRunner.app
          path: build/ModRunner.app

  # The engine and the command line are Foundation and nothing else — the one
  # Apple framework in the library, AVFoundation, is confined to AudioOutput.
  # This job is what keeps that true: the app itself is macOS-only and is not
  # built here, but everything under it has to compile and pass its tests on
  # Linux and Windows.
  # Two jobs rather than one matrix: the toolchain arrives differently on each
  # side — Linux has an official image, Windows needs the installer action — and
  # a matrix would only hide that behind conditionals on every step.
  linux:
    name: Engine and CLI on Linux
    runs-on: ubuntu-latest
    container: swift:6.0

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build the engine and the command line
        run: swift build -c release --product modrunner

      - name: Test
        # The snapshot suite is macOS-only and stands itself down; the loader,
        # replayer, localisation and CLI suites run here in full.
        run: swift test

  windows:
    name: Engine and CLI on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        # Not 6.0.3: its module maps collide with the Windows SDK the runners
        # now ship, and every compile stops at "cyclic dependency in module
        # 'ucrt'" before it ever reaches our own sources.
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE

      - name: Show toolchain
        run: swift --version

      - name: Build the engine and the command line
        run: swift build -c release --product modrunner

      - name: Test
        run: swift test

  lint:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        # Violations appear as annotations on the diff. Warnings do not fail
        # the build; only rules configured with error severity do.
        run: swiftlint lint --reporter github-actions-logging
